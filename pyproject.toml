[project]
name = "math-agent-2"
version = "0.1.0"
description = "Branching mathematical search with local criticism and one novel retry"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "httpx>=0.28,<1",
    "langchain-openai>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["math_agent", "planner_executer"]
